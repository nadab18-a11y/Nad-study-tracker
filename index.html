<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amira's Study Tracker</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --cream: #faf7f2;
  --cream-dark: #f3eee7;
  --white: #fffdf9;

  --rose: #c98f9b;
  --rose-dark: #ad6f7d;
  --rose-light: #f3dfe3;
  --rose-pale: #f9edf0;

  --brown: #4a3b3b;
  --brown-light: #756565;
  --muted: #9a8d8d;

  --border: #eadfda;

  --shadow:
    0 8px 30px rgba(86, 65, 65, 0.07);

  --shadow-hover:
    0 14px 35px rgba(86, 65, 65, 0.11);
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at top left,
      #fffaf7 0%,
      transparent 35%
    ),
    var(--cream);

  color: var(--brown);
  line-height: 1.6;
}

/* =========================
   HEADER
========================= */

header {
  position: relative;
  overflow: hidden;

  background:
    linear-gradient(
      135deg,
      #ead1d6 0%,
      #f1dfe1 45%,
      #f7ebe8 100%
    );

  color: var(--brown);

  padding: 48px 20px 42px;
  text-align: center;

  border-bottom: 1px solid #eadbdd;
}

header::before {
  content: "✦";
  position: absolute;
  top: 18px;
  left: 12%;
  font-size: 20px;
  color: rgba(173, 111, 125, 0.35);
}

header::after {
  content: "♡";
  position: absolute;
  bottom: 15px;
  right: 12%;
  font-size: 25px;
  color: rgba(173, 111, 125, 0.3);
}

header h1 {
  margin: 0 0 8px;

  font-family: Georgia, "Times New Roman", serif;

  font-size: clamp(30px, 5vw, 44px);
  font-weight: 500;
  letter-spacing: -0.5px;
}

header div {
  color: #796767;
  font-size: 15px;
  letter-spacing: 0.3px;
}

/* =========================
   CONTAINER
========================= */

.container {
  max-width: 1050px;
  margin: 35px auto;
  padding: 0 18px;
}

/* =========================
   CARDS
========================= */

.card {
  background: rgba(255, 253, 249, 0.95);

  padding: 27px;
  margin-bottom: 22px;

  border: 1px solid var(--border);
  border-radius: 22px;

  box-shadow: var(--shadow);

  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease;
}

.card:hover {
  box-shadow: var(--shadow-hover);
}

.card h2 {
  margin-top: 0;
  margin-bottom: 20px;

  font-family: Georgia, "Times New Roman", serif;

  font-size: 23px;
  font-weight: 500;
  color: var(--brown);
}

.card h3 {
  margin-bottom: 8px;
  color: var(--brown);
}

.card h4 {
  margin-top: 20px;
  color: var(--brown-light);
}

/* =========================
   INPUTS
========================= */

input,
select {
  width: 100%;

  padding: 13px 15px;
  margin: 7px 0 15px;

  border: 1px solid var(--border);
  border-radius: 12px;

  background: #fffefa;
  color: var(--brown);

  font-size: 15px;

  outline: none;

  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;
}

input::placeholder {
  color: #b4a8a8;
}

input:focus,
select:focus {
  border-color: var(--rose);

  box-shadow:
    0 0 0 3px rgba(201, 143, 155, 0.12);

  background: white;
}

/* =========================
   LABELS
========================= */

label {
  display: block;

  color: var(--brown-light);

  font-size: 13px;
  font-weight: 600;

  margin-top: 4px;
  letter-spacing: 0.2px;
}

/* =========================
   BUTTONS
========================= */

button {
  border: none;

  padding: 11px 18px;

  border-radius: 12px;

  cursor: pointer;

  font-size: 14px;
  font-weight: 600;

  background: var(--rose);
  color: white;

  box-shadow:
    0 4px 12px rgba(173, 111, 125, 0.18);

  transition:
    transform 0.18s ease,
    background 0.18s ease,
    box-shadow 0.18s ease;
}

button:hover {
  background: var(--rose-dark);

  transform: translateY(-1px);

  box-shadow:
    0 7px 16px rgba(173, 111, 125, 0.22);
}

button:active {
  transform: translateY(0);
}

.delete {
  background: #c98787;

  box-shadow:
    0 4px 10px rgba(180, 100, 100, 0.12);
}

.delete:hover {
  background: #b86e6e;
}

/* =========================
   STATS
========================= */

.stats {
  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(160px, 1fr));

  gap: 14px;
}

.stat {
  background:
    linear-gradient(
      145deg,
      #fffaf7,
      #f8efed
    );

  padding: 20px 16px;

  border-radius: 17px;

  border: 1px solid #eee1dd;

  text-align: center;

  color: var(--brown-light);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.stat:hover {
  transform: translateY(-2px);

  box-shadow:
    0 8px 20px rgba(86, 65, 65, 0.07);
}

.stat strong {
  display: block;

  font-family: Georgia, "Times New Roman", serif;

  font-size: 26px;

  margin-top: 5px;

  color: var(--brown);
}

/* =========================
   DAILY GOAL
========================= */

.goal-box {
  background:
    linear-gradient(
      135deg,
      #f9edf0,
      #f7efeb
    );

  padding: 20px;

  border-radius: 18px;

  margin-top: 18px;

  border: 1px solid #eddcdf;
}

.goal-box h3 {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 500;
}

.goal-progress {
  height: 13px;

  background: #eadfe0;

  border-radius: 20px;

  overflow: hidden;

  margin: 14px 0;
}

.goal-progress-bar {
  height: 100%;

  background:
    linear-gradient(
      90deg,
      var(--rose),
      #dba5af
    );

  width: 0%;

  border-radius: 20px;

  transition: width 0.5s ease;
}

#goalText {
  color: var(--brown-light);
  font-size: 14px;
}

/* =========================
   STREAK
========================= */

.streak {
  font-family: Georgia, "Times New Roman", serif;

  font-size: 34px;

  font-weight: 500;

  color: var(--rose-dark);
}

/* =========================
   MODULE
========================= */

.module {
  border: 1px solid var(--border);

  border-radius: 18px;

  padding: 20px;

  margin-bottom: 16px;

  background:
    linear-gradient(
      145deg,
      #fffdfa,
      #fbf6f1
    );

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.module:hover {
  transform: translateY(-2px);

  box-shadow:
    0 10px 25px rgba(86, 65, 65, 0.07);
}

.module h3 {
  font-family: Georgia, "Times New Roman", serif;

  font-size: 21px;

  font-weight: 500;

  margin-top: 0;
}

.module p {
  color: var(--brown-light);
}

/* =========================
   MODULE PROGRESS
========================= */

.progress {
  height: 10px;

  background: #ebe2df;

  border-radius: 20px;

  overflow: hidden;

  margin: 12px 0;
}

.progress-bar {
  height: 100%;

  background:
    linear-gradient(
      90deg,
      var(--rose),
      #dca8b1
    );

  width: 0%;

  border-radius: 20px;

  transition: width 0.5s ease;
}

/* =========================
   COURSE
========================= */

.course {
  background: #fffaf7;

  border: 1px solid #eee2de;

  border-radius: 14px;

  padding: 14px;

  margin-top: 10px;

  transition:
    background 0.2s ease,
    transform 0.2s ease;
}

.course:hover {
  background: #fff7f5;

  transform: translateX(2px);
}

.course-header {
  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 12px;
}

.course-name {
  font-weight: 600;

  color: var(--brown);
}

.course-time {
  font-size: 13px;

  color: var(--muted);

  margin-top: 2px;
}

.status {
  border: 1px solid #eadbdd;

  padding: 7px 10px;

  border-radius: 20px;

  font-size: 12px;

  background: #f8edef;

  color: var(--brown);

  margin: 0;

  width: auto;

  cursor: pointer;
}

.status:focus {
  box-shadow: none;
}

.add-course {
  margin-top: 16px;

  padding-top: 16px;

  border-top: 1px solid #eee3df;
}

/* =========================
   TIMER
========================= */

.timer {
  text-align: center;

  font-family:
    "Courier New",
    monospace;

  font-size: clamp(44px, 9vw, 68px);

  font-weight: 500;

  letter-spacing: 2px;

  margin: 28px 0;

  color: var(--brown);

  background:
    linear-gradient(
      135deg,
      #faf0ef,
      #f6e7e7
    );

  border-radius: 20px;

  padding: 24px 10px;

  border: 1px solid #ebdcdc;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.8);
}

/* =========================
   WEEKLY CHART
========================= */

.day-row {
  display: grid;

  grid-template-columns:
    50px 1fr 65px;

  align-items: center;

  gap: 12px;

  margin: 14px 0;
}

.day-label {
  font-weight: 600;

  color: var(--brown-light);

  font-size: 13px;
}

.chart-bar {
  height: 13px;

  background: #eee5e2;

  border-radius: 20px;

  overflow: hidden;
}

.chart-fill {
  height: 100%;

  background:
    linear-gradient(
      90deg,
      var(--rose),
      #dba7b0
    );

  border-radius: 20px;

  transition: width 0.5s ease;
}

.day-hours {
  text-align: right;

  font-size: 13px;

  color: var(--brown-light);
}

/* =========================
   SESSIONS
========================= */

.session {
  padding: 15px 5px;

  border-bottom: 1px solid #eee5e2;

  color: var(--brown);
}

.session:last-child {
  border-bottom: none;
}

.small {
  color: var(--muted);

  font-size: 13px;
}

.empty {
  color: var(--muted);

  text-align: center;

  padding: 25px 15px;

  background: #fbf7f4;

  border-radius: 15px;

  border: 1px dashed #e5d8d4;
}

/* =========================
   RESPONSIVE / PHONE
========================= */

@media (max-width: 650px) {

  header {
    padding: 38px 18px 34px;
  }

  header h1 {
    font-size: 30px;
  }

  .container {
    margin: 22px auto;

    padding: 0 12px;
  }

  .card {
    padding: 20px;

    border-radius: 18px;

    margin-bottom: 16px;
  }

  .card h2 {
    font-size: 21px;
  }

  .stats {
    grid-template-columns:
      repeat(2, 1fr);

    gap: 10px;
  }

  .stat {
    padding: 16px 10px;
  }

  .stat strong {
    font-size: 22px;
  }

  .course-header {
    align-items: flex-start;

    flex-direction: column;
  }

  .status {
    width: 100%;
  }

  .timer {
    font-size: 42px;

    padding: 22px 5px;
  }

  .day-row {
    grid-template-columns:
      42px 1fr 55px;

    gap: 8px;
  }

  button {
    padding: 10px 14px;
  }
}

/* =========================
   SUBTLE SCROLLBAR
========================= */

::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: var(--cream);
}

::-webkit-scrollbar-thumb {
  background: #d8b8bd;

  border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--rose);
}

</style>
</head>


<body>


<header>

<h1>🩺 Amira's Study Tracker</h1>

<div>Study smarter. Track your progress.</div>

</header>


<div class="container">


<!-- DASHBOARD -->

<div class="card">

<h2>📊 Dashboard</h2>

<div class="stats">

<div class="stat">
Total studied
<strong id="totalTime">0h 00m</strong>
</div>

<div class="stat">
Today
<strong id="todayTime">0h 00m</strong>
</div>

<div class="stat">
Sessions
<strong id="sessionCount">0</strong>
</div>

<div class="stat">
Modules
<strong id="moduleCount">0</strong>
</div>

</div>


<div class="goal-box">

<h3>🎯 Today's Goal</h3>

<div>

<input
id="dailyGoal"
type="number"
min="0.5"
step="0.5"
value="3"
onchange="saveGoal()"
>

<label>
Daily goal in hours
</label>

</div>


<div class="goal-progress">

<div
id="goalProgressBar"
class="goal-progress-bar">
</div>

</div>


<div id="goalText">
0h 00m / 3h
</div>

</div>

</div>



<!-- STREAK -->

<div class="card">

<h2>🔥 Study Streak</h2>

<div class="stats">

<div class="stat">

Current streak

<div class="streak">
<span id="currentStreak">0</span> 🔥
</div>

</div>


<div class="stat">

Best streak

<div class="streak">
<span id="bestStreak">0</span> 🏆
</div>

</div>

</div>

</div>



<!-- WEEKLY CHART -->

<div class="card">

<h2>📈 This Week</h2>

<div id="weeklyChart"></div>

</div>



<!-- ADD MODULE -->

<div class="card">

<h2>➕ Add a module</h2>

<input
id="moduleName"
placeholder="Module name (e.g. Uro-Nephro)"
>

<label>Exam date</label>

<input
id="examDate"
type="date"
>

<label>Target study hours</label>

<input
id="targetHours"
type="number"
min="0"
placeholder="Example: 50"
>

<button onclick="addModule()">
Add Module
</button>

</div>



<!-- MODULES -->

<div class="card">

<h2>📚 My Modules</h2>

<div id="modules"></div>

</div>



<!-- TIMER -->

<div class="card">

<h2>⏱️ Study Timer</h2>

<label>Module</label>

<select
id="timerModule"
onchange="updateCourseSelect()"
>

<option value="">
Choose a module
</option>

</select>


<label>Course</label>

<select id="timerCourse">

<option value="">
Choose a course
</option>

</select>


<div class="timer" id="timer">
00:00:00
</div>


<div style="text-align:center;">

<button onclick="startTimer()">
▶ Start
</button>

<button onclick="pauseTimer()">
⏸ Pause
</button>

<button onclick="stopTimer()">
⏹ Stop & Save
</button>

</div>

</div>



<!-- SESSIONS -->

<div class="card">

<h2>📝 Study Sessions</h2>

<div id="sessions"></div>

</div>


</div>



<script>


/* =========================
DATA
========================= */

let modules =
JSON.parse(localStorage.getItem("modules")) || [];

let sessions =
JSON.parse(localStorage.getItem("sessions")) || [];

let dailyGoal =
Number(localStorage.getItem("dailyGoal")) || 3;


let timerInterval = null;

let startTime = null;

let elapsedBeforePause = 0;

let active = false;



/* =========================
SAVE DATA
========================= */

function saveData() {

localStorage.setItem(
"modules",
JSON.stringify(modules)
);

localStorage.setItem(
"sessions",
JSON.stringify(sessions)
);

}



/* =========================
DAILY GOAL
========================= */

function saveGoal() {

dailyGoal =
Number(
document.getElementById("dailyGoal").value
);

if (dailyGoal <= 0) {

dailyGoal = 3;

document.getElementById(
"dailyGoal"
).value = 3;

}

localStorage.setItem(
"dailyGoal",
dailyGoal
);

renderDashboard();

}



/* =========================
DATE HELPERS
========================= */

function getDateString(date) {

return date.toLocaleDateString(
"en-CA"
);

}


function isToday(dateString) {

const date =
new Date(dateString);

return (
date.getFullYear() === new Date().getFullYear() &&
date.getMonth() === new Date().getMonth() &&
date.getDate() === new Date().getDate()
);

}



/* =========================
TODAY TIME
========================= */

function getTodayTime() {

return sessions

.filter(session =>
isToday(session.date)
)

.reduce(
(total, session) =>
total + session.duration,
0
);

}



/* =========================
ADD MODULE
========================= */

function addModule() {

const name =
document.getElementById(
"moduleName"
).value.trim();

const examDate =
document.getElementById(
"examDate"
).value;

const targetHours =
Number(
document.getElementById(
"targetHours"
).value
);


if (!name) {

alert(
"Please enter a module name."
);

return;

}


modules.push({

id: Date.now(),

name: name,

examDate: examDate,

targetHours: targetHours,

courses: []

});


saveData();


document.getElementById(
"moduleName"
).value = "";

document.getElementById(
"examDate"
).value = "";

document.getElementById(
"targetHours"
).value = "";


render();

}



/* =========================
DELETE MODULE
========================= */

function deleteModule(id) {

if (!confirm(
"Delete this module and its courses?"
)) return;


modules =
modules.filter(
module => module.id !== id
);


saveData();

render();

}



/* =========================
ADD COURSE
========================= */

function addCourse(moduleId) {

const input =
document.getElementById(
"courseInput-" + moduleId
);


const name =
input.value.trim();


if (!name) {

alert(
"Enter a course name."
);

return;

}


const module =
modules.find(
m => m.id === moduleId
);


if (!module) return;


if (!module.courses) {

module.courses = [];

}


module.courses.push({

id: Date.now(),

name: name,

status: "Not started"

});


input.value = "";

saveData();

render();

}



/* =========================
CHANGE COURSE STATUS
========================= */

function changeCourseStatus(
moduleId,
courseId,
newStatus
) {

const module =
modules.find(
m => m.id === moduleId
);


if (!module) return;


const course =
module.courses.find(
c => c.id === courseId
);


if (!course) return;


course.status =
newStatus;


saveData();

render();

}



/* =========================
DELETE COURSE
========================= */

function deleteCourse(
moduleId,
courseId
) {

const module =
modules.find(
m => m.id === moduleId
);


if (!module) return;


module.courses =
module.courses.filter(
c => c.id !== courseId
);


saveData();

render();

}



/* =========================
COURSE TIME
========================= */

function getCourseTime(courseId) {

return sessions

.filter(
session =>
session.courseId == courseId
)

.reduce(
(total, session) =>
total + session.duration,
0
);

}



/* =========================
MODULE TIME
========================= */

function getModuleTime(moduleId) {

return sessions

.filter(
session =>
session.moduleId == moduleId
)

.reduce(
(total, session) =>
total + session.duration,
0
);

}



/* =========================
RENDER MODULES
========================= */

function renderModules() {

const container =
document.getElementById(
"modules"
);


if (modules.length === 0) {

container.innerHTML =
'<div class="empty">' +
'No modules yet. Add your first module above!' +
'</div>';

return;

}


container.innerHTML = "";


modules.forEach(module => {


if (!module.courses) {

module.courses = [];

}


const studiedSeconds =
getModuleTime(module.id);


const studiedHours =
studiedSeconds / 3600;


let percentage = 0;


if (module.targetHours > 0) {

percentage =
Math.min(
100,
(studiedHours /
module.targetHours) * 100
);

}


let daysText = "";


if (module.examDate) {

const today = new Date();

const exam =
new Date(
module.examDate +
"T00:00:00"
);


const difference =
Math.ceil(
(exam - today) /
(1000 * 60 * 60 * 24)
);


if (difference > 0) {

daysText =
`📅 ${difference} days until exam`;

}

else if (difference === 0) {

daysText =
"🚨 Exam today!";

}

else {

daysText =
"Exam passed";

}

}


let coursesHTML = "";


if (module.courses.length === 0) {

coursesHTML =
'<div class="small">' +
'No courses added yet.' +
'</div>';

}

else {


module.courses.forEach(
course => {


const courseSeconds =
getCourseTime(
course.id
);


coursesHTML += `

<div class="course">

<div class="course-header">

<div>

<div class="course-name">
${course.name}
</div>

<div class="course-time">
⏱ ${formatTime(courseSeconds)}
</div>

</div>


<select
class="status"
onchange="changeCourseStatus(
${module.id},
${course.id},
this.value
)"
>

<option
${course.status === "Not started"
? "selected" : ""}
>
Not started
</option>

<option
${course.status === "Studying"
? "selected" : ""}
>
Studying
</option>

<option
${course.status === "Done"
? "selected" : ""}
>
Done
</option>

</select>

</div>


<button
class="delete"
onclick="deleteCourse(
${module.id},
${course.id}
)"
>
Delete
</button>

</div>

`;

});

}


container.innerHTML += `

<div class="module">

<h3>
${module.name}
</h3>

<div class="small">
${daysText}
</div>

<p>

Studied:
<strong>
${formatTime(studiedSeconds)}
</strong>

${module.targetHours
? " / " +
module.targetHours +
"h"
: ""}

</p>


<div class="progress">

<div
class="progress-bar"
style="width:${percentage}%">
</div>

</div>


<div class="small">
${percentage.toFixed(0)}% of target
</div>


<h4>
📚 Courses
</h4>

${coursesHTML}


<div class="add-course">

<input
id="courseInput-${module.id}"
placeholder="Add a course..."
>

<button
onclick="addCourse(${module.id})"
>
+ Add Course
</button>

</div>


<button
class="delete"
onclick="deleteModule(
${module.id}
)"
>
Delete Module
</button>

</div>

`;

});

}



/* =========================
TIMER
========================= */

function startTimer() {

const moduleId =
document.getElementById(
"timerModule"
).value;


const courseId =
document.getElementById(
"timerCourse"
).value;


if (!moduleId) {

alert(
"Choose a module first."
);

return;

}


if (!courseId) {

alert(
"Choose a course first."
);

return;

}


if (active) return;


active = true;

startTime =
Date.now();


timerInterval =
setInterval(
updateTimer,
1000
);

}



/* =========================
PAUSE
========================= */

function pauseTimer() {

if (!active) return;


elapsedBeforePause +=

Math.floor(
(Date.now() -
startTime) / 1000
);


clearInterval(
timerInterval
);

active = false;

updateTimer();

}



/* =========================
STOP & SAVE
========================= */

function stopTimer() {

let duration =
elapsedBeforePause;


if (active) {

duration +=

Math.floor(
(Date.now() -
startTime) / 1000
);

}


if (duration < 1) {

alert(
"No study time recorded."
);

return;

}


const moduleId =
Number(
document.getElementById(
"timerModule"
).value
);


const courseId =
Number(
document.getElementById(
"timerCourse"
).value
);


const module =
modules.find(
m => m.id === moduleId
);


const course =
module?.courses.find(
c => c.id === courseId
);


sessions.unshift({

id: Date.now(),

moduleId: moduleId,

moduleName:
module
? module.name
: "Unknown",

courseId: courseId,

courseName:
course
? course.name
: "Unknown",

duration: duration,

date:
new Date().toString()

});


clearInterval(
timerInterval
);


timerInterval = null;

startTime = null;

elapsedBeforePause = 0;

active = false;


document.getElementById(
"timer"
).textContent =
"00:00:00";


saveData();

render();

}



/* =========================
UPDATE TIMER
========================= */

function updateTimer() {

let seconds =
elapsedBeforePause;


if (active) {

seconds +=

Math.floor(
(Date.now() -
startTime) / 1000
);

}


document.getElementById(
"timer"
).textContent =
formatClock(seconds);

}



/* =========================
COURSE SELECT
========================= */

function updateCourseSelect() {

const moduleId =
Number(
document.getElementById(
"timerModule"
).value
);


const select =
document.getElementById(
"timerCourse"
);


select.innerHTML =
'<option value="">' +
'Choose a course' +
'</option>';


const module =
modules.find(
m => m.id === moduleId
);


if (!module ||
!module.courses) return;


module.courses.forEach(
course => {

select.innerHTML += `

<option value="${course.id}">
${course.name}
</option>

`;

});

}



/* =========================
MODULE SELECT
========================= */

function renderSelect() {

const select =
document.getElementById(
"timerModule"
);


const current =
select.value;


select.innerHTML =
'<option value="">' +
'Choose a module' +
'</option>';


modules.forEach(
module => {

select.innerHTML += `

<option value="${module.id}">
${module.name}
</option>

`;

});


select.value =
current;


updateCourseSelect();

}



/* =========================
SESSIONS
========================= */

function renderSessions() {

const container =
document.getElementById(
"sessions"
);


if (sessions.length === 0) {

container.innerHTML =
'<div class="empty">' +
'No study sessions yet.' +
'</div>';

return;

}


container.innerHTML = "";


sessions.forEach(
session => {

container.innerHTML += `

<div class="session">

<strong>
${session.moduleName}
</strong>

<br>

<span class="small">
📚 ${
session.courseName ||
"General"
}
</span>

<br>

⏱ ${formatTime(
session.duration
)}

<div class="small">
${new Date(
session.date
).toLocaleString()}
</div>

</div>

`;

});

}



/* =========================
DASHBOARD
========================= */

function renderDashboard() {

const totalSeconds =
sessions.reduce(
(total, session) =>
total + session.duration,
0
);


const todaySeconds =
getTodayTime();


document.getElementById(
"totalTime"
).textContent =
formatTime(
totalSeconds
);


document.getElementById(
"todayTime"
).textContent =
formatTime(
todaySeconds
);


document.getElementById(
"sessionCount"
).textContent =
sessions.length;


document.getElementById(
"moduleCount"
).textContent =
modules.length;


const goalSeconds =
dailyGoal * 3600;


const percentage =
Math.min(
100,
(todaySeconds /
goalSeconds) * 100
);


document.getElementById(
"goalProgressBar"
).style.width =
percentage + "%";


document.getElementById(
"goalText"
).textContent =

`${formatTime(
todaySeconds
)} / ${dailyGoal}h`;

}



/* =========================
STUDY DAYS
========================= */

function getStudyDates() {

const dates = new Set();


sessions.forEach(
session => {

const date =
new Date(session.date);

dates.add(
getDateString(date)
);

});


return dates;

}



/* =========================
CURRENT STREAK
========================= */

function calculateCurrentStreak() {

const studyDates =
getStudyDates();


let streak = 0;

let date =
new Date();


while (true) {

const key =
getDateString(date);


if (!studyDates.has(key)) {

break;

}


streak++;


date.setDate(
date.getDate() - 1
);

}


return streak;

}



/* =========================
BEST STREAK
========================= */

function calculateBestStreak() {

const studyDates =
getStudyDates();


if (studyDates.size === 0)
return 0;


const sorted =
Array.from(
studyDates
).sort();


let best = 1;

let current = 1;


for (
let i = 1;
i < sorted.length;
i++
) {


const previous =
new Date(
sorted[i - 1] +
"T00:00:00"
);


const currentDate =
new Date(
sorted[i] +
"T00:00:00"
);


const difference =
(
currentDate -
previous
) /
(1000 * 60 * 60 * 24);


if (difference === 1) {

current++;

best =
Math.max(
best,
current
);

}

else {

current = 1;

}

}


return best;

}



/* =========================
STREAK RENDER
========================= */

function renderStreak() {

document.getElementById(
"currentStreak"
).textContent =
calculateCurrentStreak();


document.getElementById(
"bestStreak"
).textContent =
calculateBestStreak();

}



/* =========================
WEEKLY CHART
========================= */

function renderWeeklyChart() {

const container =
document.getElementById(
"weeklyChart"
);


container.innerHTML = "";


const today =
new Date();


const days = [];


for (
let i = 6;
i >= 0;
i--
) {

const date =
new Date(today);


date.setDate(
today.getDate() - i
);


days.push(date);

}


const values =
days.map(
day => {

const key =
getDateString(day);


return sessions

.filter(
session =>
getDateString(
new Date(session.date)
) === key
)

.reduce(
(total, session) =>
total + session.duration,
0
);

});


const max =
Math.max(
...values,
3600
);


days.forEach(
(day, index) => {


const seconds =
values[index];


const percentage =
(seconds / max) * 100;


const label =
day.toLocaleDateString(
"en-US",
{
weekday: "short"
}
);


container.innerHTML += `

<div class="day-row">

<div class="day-label">
${label}
</div>

<div class="chart-bar">

<div
class="chart-fill"
style="width:${percentage}%">
</div>

</div>

<div class="day-hours">
${formatTime(seconds)}
</div>

</div>

`;

});

}



/* =========================
FORMAT
========================= */

function formatTime(seconds) {

const hours =
Math.floor(
seconds / 3600
);


const minutes =
Math.floor(
(seconds % 3600) / 60
);


return `${hours}h ${String(
minutes
).padStart(2,"0")}m`;

}


function formatClock(seconds) {

const hours =
Math.floor(
seconds / 3600
);


const minutes =
Math.floor(
(seconds % 3600) / 60
);


const secs =
seconds % 60;


return `${String(
hours
).padStart(2,"0")}:` +

`${String(
minutes
).padStart(2,"0")}:` +

`${String(
secs
).padStart(2,"0")}`;

}



/* =========================
RENDER
========================= */

function render() {

document.getElementById(
"dailyGoal"
).value =
dailyGoal;

renderModules();

renderSessions();

renderDashboard();

renderStreak();

renderWeeklyChart();

renderSelect();

}


render();

</script>

</body>
</html>
