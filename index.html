<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amira's Study Tracker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f8fa;
  color: #17324d;
}

header {
  background: #0b7285;
  color: white;
  padding: 25px;
  text-align: center;
}

header h1 {
  margin: 0 0 8px;
}

.container {
  max-width: 1000px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

h2 {
  margin-top: 0;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 7px 0 15px;
  border: 1px solid #ccd6dc;
  border-radius: 8px;
  font-size: 15px;
}

button {
  border: none;
  padding: 11px 17px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  margin: 4px;
  background: #0b7285;
  color: white;
}

button:hover {
  opacity: 0.9;
}

.delete {
  background: #d9534f;
}

.module {
  border: 1px solid #dce5e8;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

.progress {
  height: 12px;
  background: #e5eeee;
  border-radius: 10px;
  overflow: hidden;
  margin: 10px 0;
}

.progress-bar {
  height: 100%;
  background: #0b7285;
  width: 0%;
}

.timer {
  text-align: center;
  font-size: 48px;
  font-weight: bold;
  margin: 20px 0;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}

.stat {
  background: #eef7f8;
  padding: 18px;
  border-radius: 12px;
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 25px;
  margin-top: 5px;
}

.session {
  padding: 12px;
  border-bottom: 1px solid #eee;
}

.small {
  color: #687982;
  font-size: 14px;
}

.empty {
  color: #687982;
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>🩺 Amira's Study Tracker</h1>
  <div>Study smarter. Track your progress.</div>
</header>

<div class="container">

  <!-- DASHBOARD -->
  <div class="card">
    <h2>📊 Dashboard</h2>

    <div class="stats">
      <div class="stat">
        Total studied
        <strong id="totalTime">0h 00m</strong>
      </div>

      <div class="stat">
        Sessions
        <strong id="sessionCount">0</strong>
      </div>

      <div class="stat">
        Modules
        <strong id="moduleCount">0</strong>
      </div>
    </div>
  </div>

  <!-- ADD MODULE -->
  <div class="card">
    <h2>➕ Add a module</h2>

    <input id="moduleName" placeholder="Module name (e.g. Uro-Nephro)">

    <label>Exam date</label>
    <input id="examDate" type="date">

    <label>Target study hours</label>
    <input id="targetHours" type="number" min="0" placeholder="Example: 50">

    <button onclick="addModule()">Add Module</button>
  </div>

  <!-- MODULES -->
  <div class="card">
    <h2>📚 My Modules</h2>
    <div id="modules"></div>
  </div>

  <!-- TIMER -->
  <div class="card">
    <h2>⏱️ Study Timer</h2>

    <label>Module</label>
    <select id="timerModule">
      <option value="">Choose a module</option>
    </select>

    <div class="timer" id="timer">00:00:00</div>

    <div style="text-align:center;">
      <button onclick="startTimer()">▶ Start</button>
      <button onclick="pauseTimer()">⏸ Pause</button>
      <button onclick="stopTimer()">⏹ Stop & Save</button>
    </div>
  </div>

  <!-- SESSIONS -->
  <div class="card">
    <h2>📝 Study Sessions</h2>
    <div id="sessions"></div>
  </div>

</div>

<script>

let modules = JSON.parse(localStorage.getItem("modules")) || [];
let sessions = JSON.parse(localStorage.getItem("sessions")) || [];

let timerInterval = null;
let startTime = null;
let elapsedBeforePause = 0;
let active = false;


/* ---------------- MODULES ---------------- */

function saveData() {
  localStorage.setItem("modules", JSON.stringify(modules));
  localStorage.setItem("sessions", JSON.stringify(sessions));
}

function addModule() {

  const name = document.getElementById("moduleName").value.trim();
  const examDate = document.getElementById("examDate").value;
  const targetHours = Number(document.getElementById("targetHours").value);

  if (!name) {
    alert("Please enter a module name.");
    return;
  }

  modules.push({
    id: Date.now(),
    name: name,
    examDate: examDate,
    targetHours: targetHours
  });

  saveData();

  document.getElementById("moduleName").value = "";
  document.getElementById("examDate").value = "";
  document.getElementById("targetHours").value = "";

  render();
}


function deleteModule(id) {

  if (!confirm("Delete this module?")) return;

  modules = modules.filter(module => module.id !== id);

  saveData();
  render();
}


function getModuleTime(moduleId) {

  return sessions
    .filter(session => session.moduleId == moduleId)
    .reduce((total, session) => total + session.duration, 0);
}


function renderModules() {

  const container = document.getElementById("modules");

  if (modules.length === 0) {
    container.innerHTML =
      '<div class="empty">No modules yet. Add your first module above!</div>';
    return;
  }

  container.innerHTML = "";

  modules.forEach(module => {

    const studiedSeconds = getModuleTime(module.id);
    const studiedHours = studiedSeconds / 3600;

    let percentage = 0;

    if (module.targetHours > 0) {
      percentage = Math.min(
        100,
        (studiedHours / module.targetHours) * 100
      );
    }

    let daysText = "";

    if (module.examDate) {

      const today = new Date();
      const exam = new Date(module.examDate + "T00:00:00");

      const difference =
        Math.ceil((exam - today) / (1000 * 60 * 60 * 24));

      if (difference > 0) {
        daysText = `📅 ${difference} days until exam`;
      } else if (difference === 0) {
        daysText = "🚨 Exam today!";
      } else {
        daysText = "Exam passed";
      }
    }

    container.innerHTML += `

      <div class="module">

        <h3>${module.name}</h3>

        <div class="small">
          ${daysText}
        </div>

        <p>
          Studied:
          <strong>${formatTime(studiedSeconds)}</strong>
          ${module.targetHours ? " / " + module.targetHours + "h" : ""}
        </p>

        <div class="progress">
          <div
            class="progress-bar"
            style="width:${percentage}%">
          </div>
        </div>

        <div class="small">
          ${percentage.toFixed(0)}% of target
        </div>

        <button class="delete"
          onclick="deleteModule(${module.id})">
          Delete
        </button>

      </div>
    `;
  });
}


/* ---------------- TIMER ---------------- */

function startTimer() {

  const moduleId =
    document.getElementById("timerModule").value;

  if (!moduleId) {
    alert("Choose a module first.");
    return;
  }

  if (active) return;

  active = true;

  startTime = Date.now();

  timerInterval = setInterval(updateTimer, 1000);
}


function pauseTimer() {

  if (!active) return;

  elapsedBeforePause +=
    Math.floor((Date.now() - startTime) / 1000);

  clearInterval(timerInterval);

  active = false;

  updateTimer();
}


function stopTimer() {

  let duration = elapsedBeforePause;

  if (active) {

    duration +=
      Math.floor((Date.now() - startTime) / 1000);
  }

  if (duration < 1) {
    alert("No study time recorded.");
    return;
  }

  const moduleId =
    Number(document.getElementById("timerModule").value);

  const module =
    modules.find(m => m.id === moduleId);

  sessions.unshift({

    id: Date.now(),

    moduleId: moduleId,

    moduleName: module ? module.name : "Unknown",

    duration: duration,

    date: new Date().toLocaleString()

  });

  clearInterval(timerInterval);

  timerInterval = null;
  startTime = null;
  elapsedBeforePause = 0;
  active = false;

  document.getElementById("timer").textContent =
    "00:00:00";

  saveData();
  render();
}


function updateTimer() {

  let seconds = elapsedBeforePause;

  if (active) {

    seconds +=
      Math.floor((Date.now() - startTime) / 1000);
  }

  document.getElementById("timer").textContent =
    formatClock(seconds);
}


/* ---------------- SESSIONS ---------------- */

function renderSessions() {

  const container =
    document.getElementById("sessions");

  if (sessions.length === 0) {

    container.innerHTML =
      '<div class="empty">No study sessions yet.</div>';

    return;
  }

  container.innerHTML = "";

  sessions.forEach(session => {

    container.innerHTML += `

      <div class="session">

        <strong>${session.moduleName}</strong>

        <br>

        ⏱ ${formatTime(session.duration)}

        <div class="small">
          ${session.date}
        </div>

      </div>
    `;
  });
}


/* ---------------- DASHBOARD ---------------- */

function renderDashboard() {

  const totalSeconds =
    sessions.reduce(
      (total, session) => total + session.duration,
      0
    );

  document.getElementById("totalTime").textContent =
    formatTime(totalSeconds);

  document.getElementById("sessionCount").textContent =
    sessions.length;

  document.getElementById("moduleCount").textContent =
    modules.length;
}


/* ---------------- SELECT ---------------- */

function renderSelect() {

  const select =
    document.getElementById("timerModule");

  const current = select.value;

  select.innerHTML =
    '<option value="">Choose a module</option>';

  modules.forEach(module => {

    select.innerHTML += `
      <option value="${module.id}">
        ${module.name}
      </option>
    `;
  });

  select.value = current;
}


/* ---------------- FORMATTING ---------------- */

function formatTime(seconds) {

  const hours =
    Math.floor(seconds / 3600);

  const minutes =
    Math.floor((seconds % 3600) / 60);

  return `${hours}h ${String(minutes).padStart(2, "0")}m`;
}


function formatClock(seconds) {

  const hours =
    Math.floor(seconds / 3600);

  const minutes =
    Math.floor((seconds % 3600) / 60);

  const secs =
    seconds % 60;

  return `${String(hours).padStart(2, "0")}:` +
         `${String(minutes).padStart(2, "0")}:` +
         `${String(secs).padStart(2, "0")}`;
}


/* ---------------- RENDER EVERYTHING ---------------- */

function render() {

  renderModules();
  renderSessions();
  renderDashboard();
  renderSelect();
}

render();

</script>

</body>
</html>
